<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Hebb/Young Secret Santa</title>
<style>
:root {
  color-scheme: light;
  --ink: #233f33;
  --muted: #46564b;
  --cream: #fffcf5;
  --cranberry: #942e3a;
  --gold: #916226;
  --line: #e3d5bb;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 24px 14px;
  color: var(--ink);
  font: 16px/1.55 system-ui, sans-serif;
  background:
    radial-gradient(ellipse at 14% 15%, #e9eedf 0, transparent 48%),
    radial-gradient(ellipse at 90% 85%, #f2dfd8 0, transparent 48%),
    #f8f1e5;
}
main {
  position: relative;
  overflow: hidden;
  width: min(100%, 530px);
  padding: 35px clamp(18px, 6vw, 46px) 25px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: var(--cream);
  text-align: center;
  box-shadow: 0 14px 42px #583b2220;
}
main::before {
  content: "";
  position: absolute;
  inset: 0 0 auto;
  height: 5px;
  background: repeating-linear-gradient(125deg, #a43c45 0 13px, #fff4df 13px 24px, #44614c 24px 37px, #fff4df 37px 48px);
}
.sparkle { position: absolute; color: var(--gold); pointer-events: none; }
.left { top: 55px; left: 19%; font-size: 20px; }
.right { top: 76px; right: 18%; font-size: 25px; }
.tiny { top: 103px; left: 25%; font-size: 12px; }
.gift {
  display: grid;
  place-items: center;
  width: 74px;
  height: 74px;
  margin: 0 auto 16px;
  border: 1px solid #dfc5a1;
  border-radius: 50%;
  color: var(--cranberry);
  background: #f8ebd5;
}
.gift svg { width: 39px; height: 39px; }
h1, h2 { font-family: Georgia, serif; font-weight: normal; line-height: 1.08; }
h1 { margin: 0 0 15px; font-size: clamp(2.2rem, 8vw, 3.8rem); letter-spacing: -.045em; }
.family {
  display: block;
  margin-bottom: 7px;
  color: var(--cranberry);
  font: 700 .77rem/1.25 system-ui, sans-serif;
  letter-spacing: .14em;
  text-transform: uppercase;
}
h2 { margin: 8px 0 20px; color: var(--cranberry); font-size: clamp(2rem, 7vw, 3.6rem); overflow-wrap: anywhere; }
p { margin: 10px 0; color: var(--muted); }
.intro { max-width: 330px; margin: 0 auto 23px; }
form { display: grid; gap: 9px; max-width: 330px; margin: 0 auto; text-align: left; }
label { font-weight: 650; }
input, button { min-height: 47px; border-radius: 8px; font: inherit; }
input { width: 100%; padding: 9px 12px; border: 1px solid #938c7a; background: #fffefd; color: var(--ink); }
button { padding: 10px 18px; border: 1px solid transparent; background: var(--cranberry); color: #fff; font-weight: 700; cursor: pointer; }
button:hover { background: #79232d; }
button:disabled { opacity: .7; cursor: wait; }
button:focus-visible, input:focus-visible { outline: 2px solid #2d654b; outline-offset: 3px; }
.secondary { border-color: #a49d89; background: transparent; color: var(--ink); }
.secondary:hover { background: #eeeee1; }
#status { margin: 12px 0 0; color: var(--ink); }
#status:empty { margin: 0; }
.rules { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 18px; margin: 23px 0 0; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: .875rem; }
.rules strong { color: var(--cranberry); }
</style>
</head>
<body>
<main>
<span class="sparkle left" aria-hidden="true">✦</span><span class="sparkle right" aria-hidden="true">✧</span><span class="sparkle tiny" aria-hidden="true">✦</span>
<div class="gift" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M9 24h30v17H9zM6 17h36v7H6zM24 17v24M24 17c-1-9-8-13-11-9-4 5 3 9 11 9Zm0 0c1-9 8-13 11-9 4 5-3 9-11 9Z"/></svg></div>
<h1><span class="family">Hebb/Young</span> Secret Santa</h1>
<section id="signin">
<p class="intro">Enter your email address and we’ll send you a private link to unwrap your assignment.</p>
<form id="sign-in">
<label for="email">Email address</label>
<input id="email" type="email" autocomplete="email" maxlength="254" required>
<button id="send" type="submit">Email me a sign-in link</button>
</form>
</section>
<section id="invite" hidden>
<p class="intro">Your assignment is ready to unwrap.</p>
<button id="unwrap" type="button">Reveal my assignment</button>
</section>
<section id="result" hidden>
<p id="greeting"></p>
<h2 id="recipient" tabindex="-1"></h2>
<button id="hide" class="secondary" type="button">Hide my assignment</button>
</section>
<p id="status" role="status" aria-live="polite"></p>
<div class="rules"><span>Gift limit <strong>$75</strong></span><span>Keep your assignment to yourself</span></div>
</main>
<script>
'use strict';
const byId = id => document.getElementById(id);
const status = byId('status');
let token = '';

function show(id) {
  for (const section of ['signin', 'invite', 'result']) byId(section).hidden = section !== id;
}
function failed(button) {
  button.disabled = false;
  status.textContent = 'Something went wrong. Please try again.';
}

byId('sign-in').addEventListener('submit', event => {
  event.preventDefault();
  const button = byId('send');
  button.disabled = true;
  status.textContent = 'Requesting your sign-in link…';
  google.script.run.withSuccessHandler(result => {
    button.disabled = false;
    status.textContent = {
      'check-inbox':'If this is the email address on the family list, check your inbox and spam folder for a sign-in link.',
      paused:'Sign-in emails are turned off for now.',
      retry:'The request could not be completed. Please try again shortly.'
    }[result.state];
  }).withFailureHandler(() => failed(button)).requestSignIn(byId('email').value);
});

byId('unwrap').addEventListener('click', () => {
  const button = byId('unwrap');
  button.disabled = true;
  status.textContent = '';
  google.script.run.withSuccessHandler(result => {
    button.disabled = false;
    token = '';
    if (result.state !== 'revealed') {
      show('signin');
      status.textContent = 'That link has expired or has already been used. Request a fresh link below.';
      return;
    }
    byId('greeting').textContent = result.giver + ', you’re shopping for';
    byId('recipient').textContent = result.recipient;
    show('result');
    byId('recipient').focus();
  }).withFailureHandler(() => failed(button)).revealAssignment(token);
});

function hideAssignment() {
  byId('greeting').textContent = '';
  byId('recipient').textContent = '';
  show('signin');
}
byId('hide').addEventListener('click', () => {
  hideAssignment();
  byId('email').focus();
});
addEventListener('pagehide', () => { if (!byId('result').hidden) hideAssignment(); });

google.script.url.getLocation(location => {
  const match = String(location.hash || '').match(/^#?signin=([a-f0-9]{64})$/);
  if (!match) return;
  token = match[1];
  show('invite');
  google.script.history.replace({}, {}, '');
});
</script>
</body>
</html>

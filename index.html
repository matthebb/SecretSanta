<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Family Secret Santa</title>
<style>
:root{color-scheme:dark;--paper:#faf1da;--muted:#d2d9c7;--gold:#f4ce82;--pine:#0b2b24;--line:#80928050}
*{box-sizing:border-box} [hidden]{display:none!important}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px 16px;color:var(--paper);font:16px/1.55 system-ui,sans-serif;background:radial-gradient(ellipse at 48% 24%,#235546,transparent 65%),#091e19}
main{width:min(100%,560px);text-align:center;padding:32px clamp(18px,6vw,56px) 25px;border:1px solid #eaca835e;border-radius:25px;background:linear-gradient(150deg,#183c31,#0b2720 68%);box-shadow:0 26px 90px #0006;position:relative;overflow:hidden}
.sparkle{position:absolute;color:#efd290a0;font-size:20px;pointer-events:none}.left{top:51px;left:15%}.right{top:87px;right:14%;font-size:26px}.tiny{top:125px;left:24%;font-size:12px}
.gift{display:grid;place-items:center;width:82px;height:82px;margin:0 auto 12px;border:1px solid #eaca8380;border-radius:100%;background:#23493b;color:var(--gold)}
.gift svg{width:44px;height:44px}
h1,h2{font-family:Georgia,serif;font-weight:normal;line-height:1.05}h1{font-size:clamp(2.5rem,8.4vw,4rem);margin:18px 0 12px;letter-spacing:-.045em}h2{font-size:clamp(2rem,7vw,3.45rem);margin:8px 0 13px;color:var(--gold);overflow-wrap:anywhere}
p{margin:10px 0;color:var(--muted)}.intro{max-width:330px;margin:0 auto 24px}
button{font:inherit;font-weight:700;cursor:pointer;color:#25130b;background:var(--gold);border:1px solid transparent;border-radius:9px;padding:11px 20px;min-height:46px}button:hover{background:#ffe3a9}button:focus-visible,textarea:focus-visible{outline:2px solid var(--paper);outline-offset:4px}button:disabled{opacity:.65;cursor:wait}
.secondary{background:transparent;border-color:#dcca91a0;color:var(--paper)}.secondary:hover{background:#355344}
textarea{display:block;margin:8px auto 12px;width:100%;resize:vertical;min-height:86px;padding:10px;color:var(--paper);background:var(--pine);border:1px solid #a9a88b;border-radius:8px;overflow-wrap:anywhere}
label{display:block;margin-top:18px;color:var(--paper);font-weight:650}small{color:var(--muted)} #status{min-height:1.55em;margin:10px 0 0;color:#f9dfad}
.rules{border-top:1px solid var(--line);margin:20px 0 0;padding:16px 0 0;display:flex;justify-content:center;gap:8px 23px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}.rules strong{color:var(--gold)}
</style>
</head>
<body>
<main>
<span class="sparkle left" aria-hidden="true">✦</span><span class="sparkle right" aria-hidden="true">✧</span><span class="sparkle tiny" aria-hidden="true">✦</span>
<div class="gift" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M9 24h30v17H9zM6 17h36v7H6zM24 17v24M24 17c-1-9-8-13-11-9-4 5 3 9 11 9Zm0 0c1-9 8-13 11-9 4 5-3 9-11 9Z"/></svg></div>
<h1>Family Secret Santa</h1>
<section id="register">
<p class="intro">Create your private key for the draw, then send Matt the public code below.</p>
<button id="make" type="button">Get my registration code</button>
<div id="code-panel" hidden>
<label for="code">Your registration code</label>
<textarea id="code" readonly spellcheck="false" rows="3"></textarea>
<button id="copy" class="secondary" type="button">Copy code</button>
<p><small>Send the code to Matt. Open the assignment link he sends back in this same browser and profile.</small></p>
</div>
</section>
<section id="invite" hidden>
<p class="intro">Your assignment is ready to unwrap.</p>
<button id="unwrap" type="button">Reveal my assignment</button>
</section>
<section id="result" hidden>
<p id="greeting"></p>
<h2 id="recipient" tabindex="-1"></h2>
<button id="hide" class="secondary" type="button">Hide my assignment</button>
</section>
<p id="status" role="status" aria-live="polite"></p>
<div class="rules"><span>Gift limit <strong>$75</strong></span><span>Keep your assignment to yourself</span></div>
<noscript><p>Enable JavaScript to register or open your assignment.</p></noscript>
</main>
<script>
"use strict";
const byId = id => document.getElementById(id);
const algorithm = {name:"RSA-OAEP", hash:"SHA-256"};
const encoder = new TextEncoder();
const decoder = new TextDecoder();
const sealed = location.hash.startsWith("#gift=") ? location.hash.slice(6) : "";
const keyId = "v1:" + location.pathname.replace(/index\.html$/, "").replace(/\/$/, "") + ":2026";

function encode(bytes) {
  return btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function decode(value) {
  if (!/^[\w-]+$/.test(value)) throw new Error("Invalid code");
  return Uint8Array.from(atob(value.replace(/-/g,"+").replace(/_/g,"/")), char => char.charCodeAt(0));
}
function database() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open("FamilySecretSanta", 1);
    request.onupgradeneeded = () => request.result.createObjectStore("keys");
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
async function withKeys(mode, work) {
  const db = await database();
  try {
    return await new Promise((resolve, reject) => {
      const transaction = db.transaction("keys", mode);
      const request = work(transaction.objectStore("keys"));
      transaction.oncomplete = () => resolve(request.result);
      transaction.onabort = () => reject(transaction.error);
    });
  } finally {
    db.close();
  }
}
async function registration() {
  const existing = await withKeys("readonly", store => store.get(keyId));
  if (existing) return existing;
  const pair = await crypto.subtle.generateKey({...algorithm, modulusLength:2048, publicExponent:new Uint8Array([1,0,1])}, false, ["encrypt","decrypt"]);
  const publicCode = encode(await crypto.subtle.exportKey("spki", pair.publicKey));
  const record = {privateKey:pair.privateKey, publicCode};
  try {
    await withKeys("readwrite", store => store.add(record, keyId));
    return record;
  } catch (error) {
    if (error?.name !== "ConstraintError") throw error;
    return withKeys("readonly", store => store.get(keyId));
  }
}
function clearResult() {
  byId("result").hidden = true;
  byId("recipient").textContent = "";
  byId("greeting").textContent = "";
  byId("invite").hidden = false;
}
if (sealed || location.hash) {
  byId("register").hidden = true;
  byId("invite").hidden = false;
}
byId("make").addEventListener("click", async () => {
  byId("make").disabled = true;
  byId("status").textContent = "";
  try {
    const {publicCode} = await registration();
    byId("code").value = publicCode;
    byId("code-panel").hidden = false;
    byId("make").hidden = true;
    byId("code").focus();
  } catch {
    byId("status").textContent = "Couldn’t save your key. Open the HTTPS site in a regular browser window and try again.";
  } finally {
    byId("make").disabled = false;
  }
});
byId("copy").addEventListener("click", async () => {
  byId("code").select();
  try {
    await navigator.clipboard.writeText(byId("code").value);
    byId("status").textContent = "Registration code copied.";
  } catch {
    byId("status").textContent = "Use your device’s copy command to copy the selected code.";
  }
});
byId("unwrap").addEventListener("click", async () => {
  byId("unwrap").disabled = true;
  byId("status").textContent = "";
  try {
    const bytes = decode(sealed);
    if (bytes.length !== 256) throw new Error("Invalid link");
    const record = await withKeys("readonly", store => store.get(keyId));
    if (!record) {
      byId("status").textContent = "Open this link in the same browser and profile you used to register.";
      return;
    }
    const plaintext = await crypto.subtle.decrypt(algorithm, record.privateKey, bytes);
    const {giver, recipient} = JSON.parse(decoder.decode(plaintext));
    if (typeof giver !== "string" || typeof recipient !== "string" || !giver || !recipient || giver === recipient) throw new Error("Invalid assignment");
    byId("greeting").textContent = giver + ", you’re shopping for";
    byId("recipient").textContent = recipient;
    byId("invite").hidden = true;
    byId("result").hidden = false;
    byId("recipient").focus();
  } catch {
    byId("status").textContent = "This link couldn’t be opened. Check that it’s your complete link and you’re in the browser you used to register.";
  } finally {
    byId("unwrap").disabled = false;
  }
});
byId("hide").addEventListener("click", () => {
  clearResult();
  byId("unwrap").focus();
});
addEventListener("pagehide", () => { if (!byId("result").hidden) clearResult(); });
</script>
</body>
</html>
